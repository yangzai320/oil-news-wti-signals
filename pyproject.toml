[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oilnews"
version = "1.0.0"
description = "Topic-based oil-news signals for short-horizon WTI direction prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4,<1.8",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.40"]
trees = ["xgboost>=2.0", "lightgbm>=4.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
oilnews = "oilnews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
